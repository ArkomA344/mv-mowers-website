{% extends "base.html" %}{% block title %}Create account | MV Mowers{% endblock %}{% block content %}
<section class="auth-wrap"><form class="form-card auth-card" method="post"><span class="eyebrow">CUSTOMER PORTAL</span><h1>CREATE ACCOUNT</h1><label>Name<input required name="name" maxlength="100"></label><label>Email<input required type="email" name="email"></label><label>Password<input required type="password" name="password" minlength="10" autocomplete="new-password"></label><small>Use at least 10 characters. Do not reuse a password from another account.</small><button class="button button-red">Create account</button><p>Already registered? <a href="{{ url_for('login') }}">Sign in</a></p></form></section>
{% endblock %}
